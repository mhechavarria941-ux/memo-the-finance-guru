<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1E1B18"/>
  <rect x="36" y="36" width="440" height="440" rx="84" fill="#FAF7F2"/>
  <!-- Memo the Skinny Owl with Tired Eyes -->
  <g transform="translate(136, 76)">
    <!-- Skinny Owl Body -->
    <rect x="52" y="70" width="136" height="220" rx="68" fill="#6E5A4F"/>
    <!-- Belly Ledger Lines -->
    <rect x="74" y="156" width="92" height="110" rx="44" fill="#EFE8DC"/>
    <line x1="90" y1="184" x2="150" y2="184" stroke="#C86D3B" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="208" x2="150" y2="208" stroke="#8C7A6B" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="232" x2="134" y2="232" stroke="#2E6F40" stroke-width="5" stroke-linecap="round"/>
    <!-- Ear Tufts -->
    <path d="M58 92 L36 44 L86 74 Z" fill="#54433A"/>
    <path d="M182 92 L204 44 L154 74 Z" fill="#54433A"/>
    <!-- Large Tired Eyes -->
    <circle cx="92" cy="112" r="28" fill="#FAF7F2" stroke="#3E322B" stroke-width="6"/>
    <circle cx="148" cy="112" r="28" fill="#FAF7F2" stroke="#3E322B" stroke-width="6"/>
    <circle cx="92" cy="118" r="9" fill="#1E1B18"/>
    <circle cx="148" cy="118" r="9" fill="#1E1B18"/>
    <!-- Heavy Tired Eyelids -->
    <path d="M64 108 Q92 122 120 108 L118 90 Q92 80 66 90 Z" fill="#8C7A6B"/>
    <path d="M120 108 Q148 122 176 108 L174 90 Q148 80 122 90 Z" fill="#8C7A6B"/>
    <line x1="64" y1="109" x2="120" y2="109" stroke="#3E322B" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="109" x2="176" y2="109" stroke="#3E322B" stroke-width="5" stroke-linecap="round"/>
    <!-- Under-eye tired creases -->
    <path d="M76 145 Q92 152 108 145" fill="none" stroke="#54433A" stroke-width="3" stroke-linecap="round"/>
    <path d="M132 145 Q148 152 164 145" fill="none" stroke="#54433A" stroke-width="3" stroke-linecap="round"/>
    <!-- Beak -->
    <polygon points="112,126 128,126 120,146" fill="#C86D3B"/>
    <!-- Feet on Ledger Bar -->
    <line x1="24" y1="292" x2="216" y2="292" stroke="#C86D3B" stroke-width="10" stroke-linecap="round"/>
    <path d="M88 286 L88 302 M98 286 L98 302" stroke="#C86D3B" stroke-width="6" stroke-linecap="round"/>
    <path d="M142 286 L142 302 M152 286 L152 302" stroke="#C86D3B" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
